<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            width: 300px;
            height: 400px;
            background-image: url('https://images.unsplash.com/photo-1607799279861-4dd421887fb3?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTZ8fGNvZGluZ3xlbnwwfHwwfHx8MA%3D%3D');
            background-size: cover;
            border-radius: 20px;
            color: white;
            position: relative;
            overflow: hidden;

        }

        p {
            transition: all .4s linear;

            position: absolute;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.265);
            backdrop-filter: blur(20px);
            /* left: 100%; */

            transform: rotate(0) scale(0);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .card:hover p {
            /* left: 0; */
            transform: rotate(360deg) scale(1);
        }
    </style>
</head>

<body>
    <div class="card">
        <p>
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Praesentium facere, porro aliquid architecto quasi
            ad molestias. Temporibus numquam quam, odio hic vel repellat incidunt architecto sequi a dolorem magnam
            nostrum.
        </p>
    </div>
</body>

</html>
